name: SEO Content Agent

on:
  # Run every Monday at 8:00 AM Philippines time (UTC+8 = 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  run-seo-agent:
    name: Generate & Publish SEO Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-agent
        run: npm install

      - name: Run SEO Agent
        working-directory: seo-agent
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_AUTHOR_ID: ${{ secrets.SANITY_AUTHOR_ID }}
        run: node agent.js

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ SEO Agent failed. Check the logs above for details."
          echo "Common issues:"
          echo "  - Notion token expired or missing database access"
          echo "  - Sanity API token lacks write permissions"
          echo "  - Claude API key invalid or quota exceeded"
          exit 1
